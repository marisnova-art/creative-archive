<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1619">
<title>Creative Archive — 아이디어 아카이브</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%237FD1C7%22/><text x=%2216%22 y=%2223%22 font-family=%22Arial,sans-serif%22 font-size=%2220%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%2308201E%22>C</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
/* ── 토큰 ───────────────────────────────────────────── */
:root{
  --bg:#0E1619; --panel:#131E22; --raise:#17242A; --raise2:#1D2C33;
  --line:#22333A; --line2:#2E444C;
  --ink:#E3EAEB; --sub:#91A4AA; --mute:#5E7279;
  --sea:#7FD1C7; --sea-ink:#08201E; --star:#F2C35B; --danger:#EF7D6D; --ok:#74D39D;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --side:272px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
html.locked{overflow:hidden}
body{
  min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:anywhere;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 레이아웃 ───────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100dvh}
.mob{display:none}

/* 사이드바 */
.side{
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;padding:24px 22px 20px}
.brand-mark{
  width:32px;height:32px;border-radius:9px;background:var(--sea);color:var(--sea-ink);
  display:grid;place-items:center;font-weight:800;font-size:17px;flex-shrink:0
}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:12px;color:var(--mute);margin-top:2px}

.side-scroll{flex:1;overflow-y:auto;padding:4px 12px 16px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.nav-group + .nav-group{margin-top:20px}
.nav-head{font-size:12px;color:var(--mute);padding:0 10px 8px;font-weight:500}
.nav-item{
  --c:var(--sub);
  width:100%;height:38px;display:flex;align-items:center;gap:11px;padding:0 10px;
  border-radius:var(--r-s);color:var(--sub);font-size:14px;text-align:left;position:relative;
  transition:background .12s,color .12s;
}
.nav-item i{width:16px;text-align:center;font-size:13px;color:var(--c);opacity:.85}
.nav-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .cnt{font-size:12px;color:var(--mute)}
.nav-item.zero .lbl,.nav-item.zero i{opacity:.45}
.nav-item:hover{background:var(--raise);color:var(--ink)}
.nav-item.active{background:var(--raise2);color:var(--ink);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.nav-item.active .cnt{color:var(--ink)}

.side-foot{padding:14px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

/* 연동 상태 */
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);min-width:0}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--sea);flex-shrink:0}
.sync[data-state="sync"] .dot{animation:pulse 1.2s ease-in-out infinite}
.sync[data-state="ok"] .dot{background:var(--ok)}
.sync[data-state="info"] .dot{background:var(--sub)}
.sync[data-state="warn"] .dot{background:var(--star)}
.sync span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{50%{opacity:.25}}

/* 메인 */
.main{display:flex;flex-direction:column;min-width:0;width:100%;max-width:980px;padding:44px 56px 72px}

.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:22px}
.view-title{display:flex;align-items:baseline;gap:12px;min-width:0}
.view-title h1{font-size:34px;line-height:1.1;font-weight:750;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-title .count{font-size:17px;color:var(--mute);font-weight:500}
.view-title .sw{width:10px;height:10px;border-radius:3px;background:var(--c,transparent);align-self:center;flex-shrink:0}

/* 정렬 세그먼트 */
.seg{display:inline-flex;padding:3px;background:var(--raise);border:1px solid var(--line);border-radius:10px;flex-shrink:0}
.seg button{height:32px;padding:0 13px;border-radius:7px;font-size:13px;color:var(--sub);white-space:nowrap}
.seg button.active{background:var(--raise2);color:var(--ink);font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}

/* 툴바 */
.tools{
  position:sticky;top:0;z-index:20;background:var(--bg);
  display:flex;flex-direction:column;gap:12px;padding:10px 0 14px;margin-bottom:6px;
}
.tools-row{display:flex;gap:10px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search i.fa-magnifying-glass{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:13px;pointer-events:none}
.search input{
  width:100%;height:44px;border-radius:11px;background:var(--raise);border:1px solid var(--line);
  padding:0 44px 0 40px;font-size:15px;outline:none;transition:border-color .15s,background .15s;
}
.search input::placeholder{color:var(--mute)}
.search input:focus{border-color:var(--sea);background:var(--raise2)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:8px;color:var(--sub);display:none}
.search.has .clear{display:grid;place-items:center}
.search .clear:hover{color:var(--ink);background:var(--raise2)}
.kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mute);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;pointer-events:none}
.search.has .kbd,.search input:focus ~ .kbd{display:none}

.btn{
  height:44px;padding:0 18px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:600;white-space:nowrap;transition:filter .12s,background .12s,border-color .12s;
}
.btn-primary{background:var(--sea);color:var(--sea-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-line{border:1px solid var(--line2);color:var(--ink);background:var(--raise)}
.btn-line:hover{background:var(--raise2)}
.btn-quiet{color:var(--sub)}
.btn-quiet:hover{color:var(--ink);background:var(--raise)}
.btn-danger{color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}

/* 카테고리 칩 레일 (모바일) */
.rail-wrap{display:none;align-items:center;gap:8px;margin:0 -16px;padding:0 0 0 16px}
.rail{
  display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-right:16px;flex:1;
  scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
}
.rail::-webkit-scrollbar{display:none}
.chip{
  --c:var(--sub);
  flex-shrink:0;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);
  display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--sub);scroll-snap-align:start;background:var(--panel);
}
.chip .d{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip .fa-star{color:var(--star);font-size:11px}
.chip .cnt{font-size:12px;color:var(--mute)}
.chip.zero{opacity:.5}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.chip.active .cnt{color:rgba(14,22,25,.6)}
.rail-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--sub);flex-shrink:0;background:var(--panel)}

/* 목록 */
.list{border-top:1px solid var(--line)}
.entry{
  --c:var(--sub);
  position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;
  padding:20px 8px 20px 20px;border-bottom:1px solid var(--line);cursor:pointer;
  transition:background .12s;
}
.entry::before{content:"";position:absolute;left:0;top:22px;height:18px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.entry:hover{background:var(--panel)}
.entry:focus-visible{outline-offset:-2px;border-radius:0}
.e-meta{display:flex;align-items:center;gap:12px;font-size:12.5px;margin-bottom:6px;min-width:0}
.e-tag{color:var(--c);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.e-tag i{font-size:11px}
.e-date{color:var(--mute)}
.e-title{grid-column:1;font-size:17px;font-weight:650;line-height:1.4;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.e-prev{grid-column:1;margin-top:5px;font-size:14px;color:var(--sub);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:68ch}
.e-links{grid-column:1;margin-top:10px;font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.star{
  grid-column:2;grid-row:1 / span 4;align-self:start;width:44px;height:44px;margin-top:-10px;border-radius:10px;
  display:grid;place-items:center;color:var(--mute);font-size:16px;transition:color .12s,background .12s,transform .15s var(--ease);
}
.star:hover{background:var(--raise2);color:var(--sub)}
.star.on{color:var(--star)}
.star:active{transform:scale(.88)}
mark{background:color-mix(in srgb,var(--sea) 26%,transparent);color:var(--ink);border-radius:3px;padding:0 1px}

/* 빈 상태 */
.empty{padding:72px 16px;text-align:center;color:var(--sub);border-bottom:1px solid var(--line)}
.empty i{font-size:26px;color:var(--mute);margin-bottom:14px;display:block}
.empty p{font-size:15px;margin-bottom:18px}

/* 페이지네이션 */
.pager{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 0 8px}
.pager-info{font-size:12.5px;color:var(--mute)}
.pager-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.page-btn{min-width:40px;height:40px;padding:0 6px;border-radius:10px;font-size:14px;color:var(--sub)}
.page-btn:hover:not(:disabled){background:var(--raise);color:var(--ink)}
.page-btn.active{background:var(--raise2);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--sea)}
.page-btn:disabled{opacity:.3;cursor:default}

/* FAB */
.fab{
  position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;
  height:56px;padding:0 22px 0 20px;border-radius:18px;background:var(--sea);color:var(--sea-ink);
  display:none;align-items:center;gap:9px;font-weight:700;font-size:15px;
  box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06) inset;
}
.fab i{font-size:15px}

/* ── 시트 / 다이얼로그 ───────────────────────────────── */
.layer{position:fixed;inset:0;z-index:50;visibility:hidden;pointer-events:none;transition:visibility 0s linear .28s}
.layer.open{visibility:visible;pointer-events:auto;transition:none}
.scrim{position:absolute;inset:0;background:rgba(4,9,11,.66);opacity:0;transition:opacity .25s}
.layer.open .scrim{opacity:1}
.sheet{
  position:absolute;display:flex;flex-direction:column;background:var(--panel);outline:none;
  transition:transform .3s var(--ease),opacity .22s;
}
.drawer{top:0;right:0;bottom:0;width:min(620px,100%);border-left:1px solid var(--line2);transform:translateX(100%)}
.dialog{left:50%;top:50%;width:min(580px,calc(100% - 48px));max-height:calc(100dvh - 64px);border:1px solid var(--line2);border-radius:16px;
  transform:translate(-50%,-47%);opacity:0;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.layer.open .drawer{transform:none}
.layer.open .dialog{transform:translate(-50%,-50%);opacity:1}
.grab{display:none}

.sheet-head{padding:22px 28px 0;flex-shrink:0}
.head-row{display:flex;align-items:center;gap:10px;min-height:44px}
.head-row .spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:var(--sub);font-size:17px;flex-shrink:0}
.icon-btn:hover{background:var(--raise2);color:var(--ink)}
.icon-btn.on{color:var(--star)}
.sheet-body{flex:1;overflow-y:auto;padding:18px 28px 28px;overscroll-behavior:contain}
.sheet-foot{flex-shrink:0;display:flex;gap:8px;justify-content:flex-end;padding:14px 28px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.dialog .sheet-foot{border-radius:0 0 16px 16px}
.sheet-title{font-size:19px;font-weight:700;letter-spacing:-.01em}

/* 상세 */
.d-tag{--c:var(--sub);display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-size:13px;font-weight:600}
.d-tag i{font-size:11px}
.d-date{font-size:13px;color:var(--mute)}
.d-title{font-size:26px;line-height:1.35;font-weight:750;letter-spacing:-.02em;margin:18px 0 0}
.d-content{margin-top:20px;font-size:16px;line-height:1.8;color:#CBD6D8;white-space:pre-wrap;max-width:62ch}
.d-links{margin-top:32px}
.d-links h3{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:10px}
.d-link{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--raise);transition:border-color .12s,background .12s}
.d-link + .d-link{margin-top:8px}
.d-link:hover{border-color:var(--sea);background:var(--raise2)}
.d-link .li{width:32px;height:32px;border-radius:8px;background:var(--raise2);display:grid;place-items:center;color:var(--sea);font-size:13px;flex-shrink:0}
.d-link .lt{flex:1;min-width:0}
.d-link .lh{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-link .lp{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-link .fa-arrow-up-right-from-square{color:var(--mute);font-size:12px}

/* 폼 */
.field + .field{margin-top:22px}
.field > label,.field > .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:9px}
.field .hint{font-weight:400;color:var(--mute);font-size:12px}
.inp{
  width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;
  padding:12px 14px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;
}
.inp::placeholder{color:var(--mute)}
.inp:focus{border-color:var(--sea);box-shadow:0 0 0 3px color-mix(in srgb,var(--sea) 18%,transparent)}
.inp.invalid{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 16%,transparent)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.7}

.cat-pick{display:flex;flex-wrap:wrap;gap:7px}
.cat-pick label{--c:var(--sub);position:relative;cursor:pointer}
.cat-pick input{position:absolute;opacity:0;pointer-events:none}
.cat-pick span{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;color:var(--sub);transition:all .12s}
.cat-pick span i{font-size:11px;color:var(--c)}
.cat-pick label:hover span{color:var(--ink)}
.cat-pick input:checked + span{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);font-weight:600}
.cat-pick input:focus-visible + span{outline:2px solid var(--sea);outline-offset:2px}

.link-row{display:flex;gap:6px;align-items:center}
.link-row + .link-row{margin-top:8px}
.link-row .inp{flex:1;min-width:0;height:46px;padding:0 14px}
.link-rm{width:44px;height:46px;border-radius:10px;color:var(--mute);display:grid;place-items:center;flex-shrink:0}
.link-rm:hover{color:var(--danger);background:var(--raise2)}
.link-add{margin-top:10px;height:40px;padding:0 12px;border-radius:9px;color:var(--sea);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.link-add:hover{background:var(--raise2)}
.link-add:disabled{color:var(--mute);cursor:default;background:none}

/* 카테고리 시트 */
.cat-sheet-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cat-sheet-list .nav-item{height:48px;background:var(--raise);border:1px solid var(--line)}
.cat-sheet-list .nav-item.active{border-color:var(--c);background:var(--raise2)}
.cat-sheet-list .nav-item.active::before{display:none}
.cat-sheet-list .wide{grid-column:1 / -1}

/* 토스트 */
.toast{
  position:fixed;left:50%;bottom:32px;z-index:80;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:12px 18px;border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.4);transition:opacity .2s,transform .25s var(--ease);max-width:calc(100% - 32px);
  display:flex;align-items:center;gap:9px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#2A0B06}

/* ── 태블릿 / 모바일 ─────────────────────────────────── */
@media (max-width:1023px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mob{display:flex}
  .main{max-width:none;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
  .mbar{order:0;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 6px}
  .mbar .brand{padding:0}
  .mbar .sync{max-width:46%}
  .tools{order:1;padding:10px 16px 12px;margin:0 -16px 4px;border-bottom:1px solid transparent;transition:border-color .15s}
  .tools.stuck{border-bottom-color:var(--line)}
  .rail-wrap{display:flex}
  .title-row{order:2;padding:12px 0 14px;align-items:center}
  .view-title h1{font-size:26px}
  .view-title .count{font-size:15px}
  .list{order:3;margin:0 -16px}
  .pager{order:4}
  .add-desk,.kbd{display:none}
  .fab{display:inline-flex}
  .entry{padding:18px 6px 18px 20px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
}
@media (max-width:719px){
  .search input,.inp{font-size:16px}
  .seg button{padding:0 11px}
  .drawer,.dialog{
    left:0;right:0;top:auto;bottom:0;width:100%;max-height:none;
    height:calc(100dvh - max(14px, env(safe-area-inset-top)));
    border:0;border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
    transform:translateY(100%);opacity:1;box-shadow:0 -20px 50px rgba(0,0,0,.4);
  }
  .dialog.fit{height:auto;max-height:86dvh}
  .layer.open .drawer,.layer.open .dialog{transform:none}
  .dialog .sheet-foot{border-radius:0}
  .grab{display:block;flex-shrink:0;height:22px;position:relative;touch-action:none}

<script>
/* ════════════════════════════════════════════════════
   데이터 · Supabase (원본 유지)
   ════════════════════════════════════════════════════ */
const SUPABASE_URL      = 'https://oivthhdphiatrswsjxej.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pdnRoaGRwaGlhdHJzd3NqeGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MjAyNDQsImV4cCI6MjA5NzE5NjI0NH0.HpMEfEjASdItN0iY4GxLzRDBE56HAM08I44Cw55TtBo';

let sbClient = null;
try {
  const lib = window.supabase || (typeof supabaseJs !== 'undefined' ? supabaseJs : null);
  if (lib && lib.createClient) sbClient = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(e) { console.error('Supabase 초기화 실패:', e); }

let archives = [
  { id: 99991, category: "AI",        title: "로컬 안전 UI 가동 성공",            content: "현재 브라우저 보안 규정 또는 서버 통신 대기 중입니다. 레이아웃과 내부 기능은 100% 정상 작동합니다.", date: "2026-06-17", favorite: false, links: [] },
  { id: 99992, category: "Marketing", title: "K-Beauty 동남아 다채널 마케팅 전략", content: "쇼피 및 인플루언서 연계 팝업 스토어 구축 프로세스 리서치 아카이브 자료입니다.",               date: "2026-06-16", favorite: true,  links: [] }
];

let currentSort = 'newest', searchKeyword = '', currentCategoryFilter = '', currentView = 'all', currentPage = 1;
const itemsPerPage = 5;
const categories    = ["AI","IT","Design","Prompt","3D","UIUX","Typo","Photo","Art","Video","Product","Business","Marketing","Development"];
const categoryIcons = { AI:"fa-brain", IT:"fa-laptop-code", Design:"fa-palette", Prompt:"fa-magic", "3D":"fa-cube", UIUX:"fa-mobile-screen", Typo:"fa-font", Photo:"fa-camera", Art:"fa-paintbrush", Video:"fa-film", Product:"fa-box", Business:"fa-briefcase", Marketing:"fa-chart-line", Development:"fa-code", Dev:"fa-code" };
const categoryDisplayName = (cat) => cat === "Dev" ? "Development" : cat;

async function fetchSupabaseData() {
  if (!sbClient) { updateSpinnerStatus('⚠️ 라이브러리 차단됨 (안전 모드)'); return; }
  try {
    const { data, error } = await sbClient.from('archives').select('*');
    if (error) throw error;
    if (data && data.length > 0) {
      archives = data.map(item => ({ ...item, links: Array.isArray(item.links) ? item.links : (item.links ? [item.links] : []), favorite: !!item.favorite }));
      updateSpinnerStatus('✅ Supabase 클라우드 연동 완료');
    } else {
      updateSpinnerStatus('ℹ️ 연결 성공 — 데이터베이스가 비어있음');
    }
  } catch(err) {
    console.warn('Supabase 오류:', err.message);
    updateSpinnerStatus('⚠️ 서버 연결 실패 (로컬 모드)');
  }
}

/* ════════════════════════════════════════════════════
   UI 헬퍼
   ════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const isTouch = matchMedia('(pointer:coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function escapeHtml(text) {
  return String(text ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function highlight(text) {
  const safe = escapeHtml(text);
  if (!searchKeyword) return safe;
  const k = escapeHtml(searchKeyword).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(k, 'gi'), m => `<mark>${m}</mark>`);
}
function catKey(cat)   { return cat === 'Dev' ? 'Development' : cat; }
function catColor(cat) {
  const i = categories.indexOf(catKey(cat));
  if (i < 0) return 'hsl(195 12% 64%)';
  const h = Math.round((i * 360 / categories.length + 176) % 360);
  return `hsl(${h} 60% 69%)`;
}
function catIcon(cat)  { return categoryIcons[cat] || 'fa-folder'; }
function fmtDate(d)    { return d ? String(d).replace(/-/g, '.') : ''; }
function findArchive(id) { return archives.find(a => String(a.id) === String(id)); }
function countIn(cat)  { return archives.filter(a => a.category === cat || (cat === 'Development' && a.category === 'Dev')).length; }

let toastTimer;
function toast(msg, isErr) {
  const t = $('toast');
  t.innerHTML = `<i class="fa-solid ${isErr ? 'fa-circle-exclamation' : 'fa-check'}"></i><span>${escapeHtml(msg)}</span>`;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* 연동 상태 표시 */
function updateSpinnerStatus(text) {
  const state = text.includes('⚠️') ? 'warn' : text.includes('✅') ? 'ok' : text.includes('ℹ️') ? 'info' : 'sync';
  const clean = text.replace(/^(⚠️|✅|ℹ️)\s*/, '');
  const short = state === 'ok' ? '클라우드 연동됨' : state === 'warn' ? '로컬 모드' : state === 'info' ? '빈 데이터베이스' : '연동 중…';
  document.querySelectorAll('#loadingSpinner, .js-sync').forEach(el => el.dataset.state = state);
  if ($('spinnerText')) $('spinnerText').textContent = clean;
  document.querySelectorAll('.js-sync-text').forEach(el => el.textContent = short);
  document.querySelectorAll('.js-sync').forEach(el => el.title = clean);
}

/* ════════════════════════════════════════════════════
   레이어(시트) 관리 — 모바일 뒤로가기로 닫힘
   ════════════════════════════════════════════════════ */
const layerStack = []; let skipPop = 0; const lastFocus = {};

function openLayer(id) {
  const el = $(id);
  if (el.classList.contains('open')) return;
  lastFocus[id] = document.activeElement;
  el.classList.add('open'); el.setAttribute('aria-hidden', 'false');
  layerStack.push(id);
  document.documentElement.classList.add('locked');
  try { history.pushState({ layer: id }, ''); } catch(e) {}
  setTimeout(() => {
    const f = el.querySelector('[data-autofocus]');
    (f && !isTouch ? f : el.querySelector('.sheet')).focus({ preventScroll: true });
  }, 60);
}
function closeLayer(id, fromPop) {
  const el = $(id);
  if (!el || !el.classList.contains('open')) return;
  el.classList.remove('open'); el.setAttribute('aria-hidden', 'true');
  const sheet = el.querySelector('.sheet'); sheet.style.transform = ''; sheet.style.transition = '';
  const i = layerStack.lastIndexOf(id); if (i > -1) layerStack.splice(i, 1);
  if (!layerStack.length) document.documentElement.classList.remove('locked');
  if (!fromPop && history.state && history.state.layer === id) { skipPop++; history.back(); }
  if (lastFocus[id] && document.contains(lastFocus[id])) lastFocus[id].focus({ preventScroll: true });
}
window.addEventListener('popstate', () => {
  if (skipPop > 0) { skipPop--; return; }
  const top = layerStack[layerStack.length - 1];
  if (top) closeLayer(top, true);
});
document.querySelectorAll('.layer .scrim').forEach(s => s.addEventListener('click', () => closeLayer(s.parentElement.id)));

/* 모바일 시트 끌어내려 닫기 */
document.querySelectorAll('.layer').forEach(layer => {
  const sheet = layer.querySelector('.sheet');
  const handles = [layer.querySelector('.grab'), layer.querySelector('.sheet-head')];
  let y0 = null, dy = 0;
  handles.forEach(h => {
    h.addEventListener('touchstart', e => { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none'; }, { passive: true });
    h.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${dy}px)`; }, { passive: true });
    h.addEventListener('touchend', () => {
      if (y0 === null) return; y0 = null; sheet.style.transition = '';
      if (dy > 110) closeLayer(layer.id); else sheet.style.transform = '';
    });
  });
});

/* ════════════════════════════════════════════════════
   카테고리 · 네비게이션 렌더
   ════════════════════════════════════════════════════ */
function navItemsData() {
  const favN = archives.filter(a => a.favorite).length;
  const items = [
    { key: 'all', label: '전체보기', icon: 'fa-layer-group', count: archives.length, active: !currentCategoryFilter && currentView === 'all', color: 'var(--sea)', go: showAll },
    { key: 'fav', label: '즐겨찾기', icon: 'fa-star', count: favN, active: currentView === 'favorites', color: 'var(--star)', go: showFavorites }
  ];
  categories.forEach(cat => items.push({
    key: cat, label: categoryDisplayName(cat), icon: catIcon(cat), count: countIn(cat),
    active: currentCategoryFilter === cat && currentView !== 'favorites', color: catColor(cat), go: () => filterByCategory(cat)
  }));
  return items;
}

function navButton(it, extraClass = '') {
  const b = document.createElement('button');
  b.className = 'nav-item' + (it.active ? ' active' : '') + (it.count === 0 && it.key !== 'all' && it.key !== 'fav' ? ' zero' : '') + extraClass;
  b.style.setProperty('--c', it.color);
  if (it.active) b.setAttribute('aria-current', 'true');
  b.innerHTML = `<i class="fa-solid ${it.icon}"></i><span class="lbl">${escapeHtml(it.label)}</span><span class="cnt num">${it.count}</span>`;
  return b;
}

function renderCategories() {
  const items = navItemsData();

  // 사이드바
  const prim = $('primaryNav'), list = $('categoryList');
  prim.innerHTML = ''; list.innerHTML = '';
  items.forEach((it, i) => {
    const b = navButton(it);
    b.onclick = it.go;
    (i < 2 ? prim : list).appendChild(b);
  });

  // 모바일 칩 레일
  const rail = $('chipRail');
  rail.innerHTML = '';
  let activeChip = null;
  items.forEach(it => {
    const c = document.createElement('button');
    c.className = 'chip' + (it.active ? ' active' : '') + (it.count === 0 && it.key !== 'all' && it.key !== 'fav' ? ' zero' : '');
    c.style.setProperty('--c', it.color);
    const mark = it.key === 'fav' ? '<i class="fa-solid fa-star"></i>' : it.key === 'all' ? '' : '<span class="d"></span>';
    c.innerHTML = `${mark}<span>${escapeHtml(it.label)}</span><span class="cnt num">${it.count}</span>`;
    c.onclick = it.go;
    if (it.active) activeChip = c;
    rail.appendChild(c);
  });
  if (activeChip) requestAnimationFrame(() => {
    const left = activeChip.offsetLeft - rail.clientWidth / 2 + activeChip.offsetWidth / 2;
    rail.scrollTo({ left: Math.max(0, left), behavior: reduceMotion ? 'auto' : 'smooth' });
  });

  // 카테고리 시트
  const sheetList = $('categorySheetList');
  sheetList.innerHTML = '';
  items.forEach(it => {
    const b = navButton(it);
    b.onclick = () => { closeMenuOnMobile(); it.go(); };
    sheetList.appendChild(b);
  });
}

function openCategorySheet() { openLayer('catSheet'); }
function closeMenuOnMobile() { closeLayer('catSheet'); }
function toggleMobileMenu()  { $('catSheet').classList.contains('open') ? closeMenuOnMobile() : openCategorySheet(); }

/* ════════════════════════════════════════════════════
   필터 · 정렬
   ════════════════════════════════════════════════════ */
function getFilteredArchives() {
  let r = [...archives];
  if (currentCategoryFilter) r = r.filter(a => a.category === currentCategoryFilter || (currentCategoryFilter === 'Development' && a.category === 'Dev'));
  if (currentView === 'favorites') r = r.filter(a => a.favorite);
  if (searchKeyword) r = r.filter(a => (a.title || '').toLowerCase().includes(searchKeyword) || (a.content || '').toLowerCase().includes(searchKeyword));
  r.sort(currentSort === 'newest'
    ? (a, b) => new Date(b.date) - new Date(a.date) || b.id - a.id
    : (a, b) => new Date(a.date) - new Date(b.date) || a.id - b.id);
  return r;
}

function updateToolbarTitle() {
  const el = $('currentFilterTitle');
  el.textContent = currentView === 'favorites' ? '즐겨찾기' : currentCategoryFilter || '전체보기';
  const sw = $('titleSwatch');
  sw.style.setProperty('--c', currentView === 'favorites' ? 'var(--star)' : currentCategoryFilter ? catColor(currentCategoryFilter) : 'transparent');
  sw.style.display = (currentView === 'favorites' || currentCategoryFilter) ? '' : 'none';
}

function filterArchives() {
  const v = $('searchInput').value;
  $('searchBox').classList.toggle('has', v.length > 0);
  searchKeyword = v.toLowerCase().trim(); currentPage = 1; renderArchives(getFilteredArchives());
}
function clearSearch() {
  $('searchInput').value = ''; $('searchBox').classList.remove('has');
  searchKeyword = ''; currentPage = 1; renderArchives(getFilteredArchives());
}
function filterByCategory(cat) { currentCategoryFilter = cat; currentView = 'all'; currentPage = 1; renderArchives(getFilteredArchives()); renderCategories(); updateToolbarTitle(); }
function showAll()             { currentCategoryFilter = ''; currentView = 'all'; currentPage = 1; renderArchives(getFilteredArchives()); renderCategories(); updateToolbarTitle(); }
function showFavorites()       { currentView = 'favorites'; currentCategoryFilter = ''; currentPage = 1; renderArchives(getFilteredArchives()); renderCategories(); updateToolbarTitle(); }

function sortArchives(type) {
  currentSort = type;
  $('sortNewest').classList.toggle('active', type === 'newest');
  $('sortOldest').classList.toggle('active', type === 'oldest');
  $('sortNewest').setAttribute('aria-pressed', type === 'newest');
  $('sortOldest').setAttribute('aria-pressed', type === 'oldest');
  currentPage = 1; renderArchives(getFilteredArchives());
}

/* ════════════════════════════════════════════════════
   목록 렌더
   ════════════════════════════════════════════════════ */
function renderArchives(list) {
  const container = $('archiveList');
  container.innerHTML = '';
  $('resultCount').textContent = list.length;

  const totalPages = Math.ceil(list.length / itemsPerPage) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const paginated = list.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

  if (!paginated.length) {
    if (searchKeyword) {
      container.innerHTML = `<div class="empty"><i class="fa-solid fa-magnifying-glass"></i><p>‘${escapeHtml($('searchInput').value.trim())}’와 맞는 아카이브가 없습니다</p><button class="btn btn-line" onclick="clearSearch()">검색어 지우기</button></div>`;
    } else if (currentView === 'favorites') {
      container.innerHTML = `<div class="empty"><i class="fa-regular fa-star"></i><p>즐겨찾기한 아카이브가 없습니다.<br>목록의 별을 눌러 추가하세요.</p></div>`;
    } else {
      container.innerHTML = `<div class="empty"><i class="fa-regular fa-folder-open"></i><p>${currentCategoryFilter ? "이 카테고리에 아직 아카이브가 없습니다" : "아직 아카이브가 없습니다"}</p><button class="btn btn-primary" onclick="showNewArchiveModal()"><i class="fa-solid fa-plus"></i>아카이브 등록</button></div>`;
    }
    renderPagination(0); return;
  }

  paginated.forEach(archive => {
    const el = document.createElement('article');
    el.className = 'entry';
    el.tabIndex = 0;
    el.dataset.id = archive.id;
    el.style.setProperty('--c', catColor(archive.category));
    const preview = String(archive.content || '').replace(/\s+/g, ' ').trim();
    const nLinks = (archive.links || []).length;
    el.innerHTML = `
      <div class="e-meta">
        <span class="e-tag"><i class="fa-solid ${catIcon(archive.category)}"></i>${escapeHtml(categoryDisplayName(archive.category))}</span>
        <span class="e-date num">${fmtDate(archive.date)}</span>
      </div>
      <h3 class="e-title">${highlight(archive.title || '')}</h3>
      ${preview ? `<p class="e-prev">${highlight(preview)}</p>` : ''}
      ${nLinks ? `<span class="e-links"><i class="fa-solid fa-link"></i>링크 ${nLinks}개</span>` : ''}
      <button class="star ${archive.favorite ? 'on' : ''}" aria-pressed="${archive.favorite}" aria-label="${archive.favorite ? '즐겨찾기 해제' : '즐겨찾기 추가'}"><i class="fa-solid fa-star"></i></button>`;
    container.appendChild(el);
  });
  renderPagination(list.length);
}

$('archiveList').addEventListener('click', e => {
  const entry = e.target.closest('.entry');
  if (!entry) return;
  if (e.target.closest('.star')) { toggleFavorite(entry.dataset.id); return; }
  showDetail(entry.dataset.id);
});
$('archiveList').addEventListener('keydown', e => {
  const entry = e.target.closest('.entry');
  if (!entry || e.target !== entry) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showDetail(entry.dataset.id); }
});

/* 페이지네이션 */
function renderPagination(total) {
  const totalPages = Math.ceil(total / itemsPerPage) || 1;
  const container  = $('pagination');
  container.innerHTML = '';
  if (currentPage > totalPages) currentPage = totalPages;
  if (total === 0) return;

  const info = document.createElement('div');
  info.className = 'pager-info num';
  const from = (currentPage - 1) * itemsPerPage + 1, to = Math.min(total, currentPage * itemsPerPage);
  info.textContent = `${total}개 중 ${from}–${to}`;
  container.appendChild(info);
  if (totalPages === 1) return;

  const row = document.createElement('div');
  row.className = 'pager-btns';
  const go = (p) => {
    currentPage = p; renderArchives(getFilteredArchives());
    const top = $('archiveList').getBoundingClientRect().top + window.scrollY - 140;
    if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: reduceMotion ? 'auto' : 'smooth' });
  };
  const makeBtn = (label, page, disabled, isActive, aria) => {
    const btn = document.createElement('button');
    btn.className = 'page-btn num' + (isActive ? ' active' : '');
    btn.innerHTML = label;
    btn.disabled = disabled;
    if (aria) btn.setAttribute('aria-label', aria);
    if (isActive) btn.setAttribute('aria-current', 'page');
    if (!disabled) btn.onclick = () => go(page);
    return btn;
  };
  row.appendChild(makeBtn('<i class="fa-solid fa-angles-left"></i>', 1, currentPage === 1, false, '첫 페이지'));
  row.appendChild(makeBtn('<i class="fa-solid fa-angle-left"></i>', currentPage - 1, currentPage === 1, false, '이전 페이지'));
  let start = Math.max(1, currentPage - 2);
  let end   = Math.min(totalPages, start + 4);
  if (end - start < 4) start = Math.max(1, end - 4);
  for (let i = start; i <= end; i++) row.appendChild(makeBtn(i, i, false, i === currentPage));
  row.appendChild(makeBtn('<i class="fa-solid fa-angle-right"></i>', currentPage + 1, currentPage === totalPages, false, '다음 페이지'));
  row.appendChild(makeBtn('<i class="fa-solid fa-angles-right"></i>', totalPages, currentPage === totalPages, false, '마지막 페이지'));
  container.appendChild(row);
}

/* ════════════════════════════════════════════════════
   상세
   ════════════════════════════════════════════════════ */
let currentDetailId = null;

function showDetail(id) {
  const archive = findArchive(id);
  if (!archive) return;
  currentDetailId = archive.id;
  $('detailModal').dataset.currentId = archive.id;

  const tag = $('modalCategory');
  tag.style.setProperty('--c', catColor(archive.category));
  tag.innerHTML = `<i class="fa-solid ${catIcon(archive.category)}"></i>${escapeHtml(categoryDisplayName(archive.category))}`;
  $('modalDate').textContent  = fmtDate(archive.date) + ' 등록';
  $('modalTitle').textContent = archive.title || '';
  $('modalContent').textContent = archive.content || '';

  const lc = $('modalLinks');
  lc.innerHTML = '';
  if (archive.links && archive.links.length) {
    const h = document.createElement('h3');
    h.textContent = `참조 링크 ${archive.links.length}개`;
    lc.appendChild(h);
    archive.links.forEach(link => {
      const href = /^[a-z][a-z0-9+.-]*:/i.test(link) ? link : 'https://' + link;
      let host = link, path = '';
      try { const u = new URL(href); host = u.hostname.replace(/^www\./, ''); path = (u.pathname + u.search).replace(/^\/$/, ''); } catch(e) {}
      const a = document.createElement('a');
      a.className = 'd-link'; a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.innerHTML = `<span class="li"><i class="fa-solid fa-link"></i></span><span class="lt"><span class="lh" style="display:block"></span><span class="lp" style="display:block"></span></span><i class="fa-solid fa-arrow-up-right-from-square"></i>`;
      a.querySelector('.lh').textContent = host;
      a.querySelector('.lp').textContent = path || link;
      lc.appendChild(a);
    });
  }
  syncModalStar(archive);
  $('detailModal').querySelector('.sheet-body').scrollTop = 0;
  openLayer('detailModal');
}
function syncModalStar(archive) {
  const b = $('modalFavBtn');
  b.classList.toggle('on', !!archive.favorite);
  b.setAttribute('aria-pressed', !!archive.favorite);
  b.setAttribute('aria-label', archive.favorite ? '즐겨찾기 해제' : '즐겨찾기 추가');
}
function closeModal() { closeLayer('detailModal'); }

/* 즐겨찾기 */
async function toggleFavorite(id) {
  const archive = findArchive(id);
  if (!archive) return;
  archive.favorite = !archive.favorite;
  renderArchives(getFilteredArchives()); renderCategories();
  if (String(currentDetailId) === String(archive.id)) syncModalStar(archive);
  if (sbClient) {
    const { error } = await sbClient.from('archives').update({ favorite: archive.favorite }).eq('id', archive.id);
    if (error) { console.error('즐겨찾기 업데이트 오류:', error.message); toast('즐겨찾기를 서버에 저장하지 못했습니다', true); }
  }
}
function toggleFavoriteInModal() { toggleFavorite(currentDetailId); }

/* 복사 */
function copyAllMetaContent() {
  const archive = findArchive(currentDetailId);
  if (!archive) return;
  const linksText = archive.links?.length ? archive.links.join('\n') : '없음';
  const text = `■ 카테고리: ${categoryDisplayName(archive.category)}\n■ 등록날짜: ${archive.date}\n■ 제목: ${archive.title}\n\n■ 내용:\n${archive.content}\n\n■ 참조 링크:\n${linksText}`;
  const done = () => toast('클립보드에 복사되었습니다');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text) ? done() : toast('복사하지 못했습니다', true));
  } else {
    fallbackCopy(text) ? done() : toast('복사하지 못했습니다', true);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
  ta.remove(); return ok;
}

/* 삭제 */
async function deleteArchive() {
  if (!confirm('이 아카이브를 삭제하시겠습니까?')) return;
  const id = currentDetailId;
  if (sbClient) {
    const { error } = await sbClient.from('archives').delete().eq('id', id);
    if (error) { console.warn('서버 삭제 실패:', error.message); toast('서버에서 삭제하지 못했습니다 (화면에서만 제거됨)', true); }
  }
  archives = archives.filter(a => String(a.id) !== String(id));
  closeModal(); renderAllViews();
  toast('삭제되었습니다');
}

/* ════════════════════════════════════════════════════
   폼 공통
   ════════════════════════════════════════════════════ */
function buildCatPicker(containerId, selected) {
  const box = $(containerId);
  box.innerHTML = '';
  const name = containerId + '-radio';
  categories.forEach((cat, i) => {
    const on = selected ? (cat === catKey(selected)) : i === 0;
    const l = document.createElement('label');
    l.style.setProperty('--c', catColor(cat));
    l.innerHTML = `<input type="radio" name="${name}" value="${cat}" ${on ? 'checked' : ''}><span><i class="fa-solid ${catIcon(cat)}"></i>${escapeHtml(categoryDisplayName(cat))}</span>`;
    box.appendChild(l);
  });
}
function pickerValue(containerId) {
  const r = $(containerId).querySelector('input:checked');
  return r ? r.value : categories[0];
}

function makeLinkRow(value, onChange) {
  const div = document.createElement('div');
  div.className = 'link-row';
  div.innerHTML = `<input type="url" class="inp" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://example.com" value="${escapeHtml(value || '')}"><button class="link-rm" aria-label="링크 삭제"><i class="fa-solid fa-xmark"></i></button>`;
  div.querySelector('.link-rm').onclick = () => { div.remove(); onChange(); };
  return div;
}
function syncLinkUI(listId, countId, addId) {
  const n = $(listId).children.length;
  $(countId).textContent = `${n} / 5`;
  $(addId).disabled = n >= 5;
}

function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = Math.max(150, ta.scrollHeight + 2) + 'px'; }
['newContent', 'editContent'].forEach(id => $(id).addEventListener('input', e => autoGrow(e.target)));
['newTitle', 'newContent', 'editTitle'].forEach(id => $(id).addEventListener('input', e => e.target.classList.remove('invalid')));

/* 등록 */
function showNewArchiveModal() {
  $('newTitle').value = ''; $('newContent').value = '';
  $('newTitle').classList.remove('invalid'); $('newContent').classList.remove('invalid');
  $('newContent').style.height = '';
  const preset = currentView !== 'favorites' && currentCategoryFilter ? currentCategoryFilter : null;
  buildCatPicker('newCategory', preset);
  $('linkInputs').innerHTML = '';
  addLinkInput();
  $('newModal').querySelector('.sheet-body').scrollTop = 0;
  openLayer('newModal');
}
function closeNewModal() { closeLayer('newModal'); }
function addLinkInput() {
  const c = $('linkInputs');
  if (c.children.length >= 5) return;
  const sync = () => syncLinkUI('linkInputs', 'newLinkCount', 'newLinkAdd');
  const row = makeLinkRow('', sync);
  c.appendChild(row); sync();
  if (c.children.length > 1) row.querySelector('input').focus();
}

async function saveNewArchive() {
  const title    = $('newTitle').value.trim();
  const content  = $('newContent').value.trim();
  const category = pickerValue('newCategory');
  if (!title || !content) {
    if (!content) $('newContent').classList.add('invalid');
    if (!title)   $('newTitle').classList.add('invalid');
    (title ? $('newContent') : $('newTitle')).focus();
    toast('제목과 내용을 모두 입력해주세요', true); return;
  }

  const links       = Array.from(document.querySelectorAll('#linkInputs input')).map(i => i.value.trim()).filter(Boolean);
  const currentDate = new Date().toISOString().split('T')[0];
  const localId     = Date.now();
  archives.unshift({ id: localId, category, title, content, date: currentDate, links, favorite: false });
  closeNewModal(); currentPage = 1; renderAllViews();
  toast('저장했습니다');

  if (sbClient) {
    const { data, error } = await sbClient.from('archives')
      .insert([{ category, title, content, date: currentDate, links, favorite: false }]).select();
    if (!error && data?.length) {
      const idx = archives.findIndex(a => a.id === localId);
      if (idx !== -1) archives[idx] = { ...data[0], favorite: !!data[0].favorite };
      renderAllViews();
    } else if (error) {
      console.error('등록 저장 오류:', error.message);
      toast('서버에 저장하지 못했습니다 (로컬에만 반영됨)', true);
    }
  }
}

/* 수정 */
function editArchive() {
  const archive = findArchive(currentDetailId);
  if (!archive) return;
  buildCatPicker('editCategory', archive.category);
  $('editTitle').value   = archive.title   || '';
  $('editContent').value = archive.content || '';
  $('editTitle').classList.remove('invalid');

  const c = $('editLinkInputs');
  c.innerHTML = '';
  const sync = () => syncLinkUI('editLinkInputs', 'editLinkCount', 'editLinkAdd');
  const links = archive.links && archive.links.length ? archive.links : [''];
  links.forEach(link => c.appendChild(makeLinkRow(link, sync)));
  sync();

  $('editModal').dataset.editId = archive.id;
  $('editModal').querySelector('.sheet-body').scrollTop = 0;
  openLayer('editModal');
  requestAnimationFrame(() => autoGrow($('editContent')));
}
function closeEditModal() { closeLayer('editModal'); }
function addEditLinkInput() {
  const c = $('editLinkInputs');
  if (c.children.length >= 5) return;
  const sync = () => syncLinkUI('editLinkInputs', 'editLinkCount', 'editLinkAdd');
  const row = makeLinkRow('', sync);
  c.appendChild(row); sync();
  row.querySelector('input').focus();
}

async function saveEditArchive() {
  const id       = findArchive($('editModal').dataset.editId)?.id;
  const title    = $('editTitle').value.trim();
  const content  = $('editContent').value.trim();
  const category = pickerValue('editCategory');
  if (!title) { $('editTitle').classList.add('invalid'); $('editTitle').focus(); toast('제목을 입력해주세요', true); return; }

  const links = Array.from(document.querySelectorAll('#editLinkInputs input')).map(i => i.value.trim()).filter(Boolean);

  const idx = archives.findIndex(a => String(a.id) === String(id));
  if (idx !== -1) archives[idx] = { ...archives[idx], category, title, content, links };

  closeEditModal();
  renderAllViews();
  showDetail(id);
  toast('수정 내용을 저장했습니다');

  if (sbClient) {
    const { error } = await sbClient.from('archives').update({ category, title, content, links }).eq('id', id);
    if (error) { console.error('수정 저장 오류:', error.message); toast('서버에 저장하지 못했습니다 (로컬에만 반영됨)', true); }
  }
}

/* ════════════════════════════════════════════════════
   전역
   ════════════════════════════════════════════════════ */
function renderAllViews() { renderCategories(); renderArchives(getFilteredArchives()); updateToolbarTitle(); }

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    const top = layerStack[layerStack.length - 1];
    if (top) { e.preventDefault(); closeLayer(top); }
    else if (document.activeElement === $('searchInput')) { clearSearch(); $('searchInput').blur(); }
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    const top = layerStack[layerStack.length - 1];
    if (top === 'newModal')  { e.preventDefault(); saveNewArchive(); }
    if (top === 'editModal') { e.preventDefault(); saveEditArchive(); }
    return;
  }
  if (!typing && !layerStack.length && e.key === '/') { e.preventDefault(); $('searchInput').focus(); }
});

/* 스크롤 시 툴바 경계선 */
const toolsEl = $('tools');
new IntersectionObserver(([en]) => toolsEl.classList.toggle('stuck', en.intersectionRatio < 1), { threshold: [1], rootMargin: '-1px 0px 0px 0px' }).observe(toolsEl);

window.onload = async function() {
  renderAllViews();
  sortArchives('newest');
  await fetchSupabaseData();
  renderAllViews();
};
</script>
